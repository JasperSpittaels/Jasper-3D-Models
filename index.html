<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Jasper 3D Models"
    >

    <meta
        name="theme-color"
        content="#08090c"
    >

    <title>Jasper 3D Models</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="site-header">

        <div class="header-container">


            <a
                href="#home"
                class="logo"
                aria-label="Jasper 3D Models home"
            >
                Jasper <span>3D Models</span>
            </a>


            <nav
                class="navigation"
                id="navigation"
                aria-label="Main navigation"
            >

                <a href="#home">
                    Home
                </a>

                <a href="#models">
                    Models
                </a>

                <a href="#about">
                    About
                </a>

            </nav>


            <button
                class="menu-button"
                id="menuButton"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="navigation"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>


        </div>

    </header>



    <main>


        <!-- =========================================
             HERO
        ========================================== -->

        <section
            class="hero"
            id="home"
            aria-labelledby="heroTitle"
        >

            <div
                class="hero-background"
                aria-hidden="true"
            ></div>


            <div class="hero-content">


                <h1 id="heroTitle">

                    Jasper

                    <span>
                        3D Models
                    </span>

                </h1>


                <a
                    href="#models"
                    class="primary-button"
                >

                    View Models

                    <span aria-hidden="true">
                        ↓
                    </span>

                </a>


            </div>

        </section>



        <!-- =========================================
             MODELS
        ========================================== -->

        <section
            class="models-section"
            id="models"
            aria-labelledby="modelsTitle"
        >

            <div class="section-container">


                <div class="section-heading">


                    <div>

                        <p class="section-label">
                            PORTFOLIO
                        </p>


                        <h2 id="modelsTitle">
                            My Models
                        </h2>

                    </div>


                    <p
                        class="model-count"
                        id="modelCount"
                    >
                        0 Models
                    </p>


                </div>



                <div
                    class="model-grid"
                    id="modelGrid"
                    aria-live="polite"
                ></div>



                <div
                    class="empty-state"
                    id="emptyState"
                    hidden
                >

                    <h3>
                        No models found
                    </h3>

                </div>


            </div>

        </section>



        <!-- =========================================
             ABOUT
        ========================================== -->

        <section
            class="about-section"
            id="about"
            aria-labelledby="aboutTitle"
        >

            <div class="section-container">


                <p class="section-label">
                    ABOUT
                </p>


                <h2 id="aboutTitle">

                    Creating things
                    <br>
                    in 3D.

                </h2>


            </div>

        </section>


    </main>



    <!-- =========================================
         IMAGE MODAL
    ========================================== -->

    <div
        class="modal"
        id="modelModal"
        aria-hidden="true"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >


        <div
            class="modal-backdrop"
            id="modalBackdrop"
        ></div>


        <div class="modal-content">


            <button
                class="modal-close"
                id="modalClose"
                type="button"
                aria-label="Close preview"
            >
                ×
            </button>


            <div class="modal-image-container">

                <img
                    id="modalImage"
                    src=""
                    alt=""
                    width="1080"
                    height="1080"
                >

            </div>


            <h2 id="modalTitle"></h2>


        </div>


    </div>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="site-footer">

        <div class="footer-container">

            <p>

                ©
                <span id="currentYear"></span>

                Jasper 3D Models

            </p>

        </div>

    </footer>



    <script
        type="module"
        src="script.js"
    ></script>


</body>

</html>
