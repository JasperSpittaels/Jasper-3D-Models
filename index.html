<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jasper's 3D Models</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            JASPER'S 3D MODELS
        </div>

        <nav>
            <a href="#models">Models</a>
        </nav>

    </nav>


    <section class="hero">

        <div>

            <p class="small-title">
                DIGITAL 3D ASSETS
            </p>

            <h1>
                Jasper's<br>
                <span>3D Models</span>
            </h1>

            <a href="#models" class="hero-button">
                Explore Models
            </a>

        </div>

    </section>


    <section id="models" class="models-section">

        <div class="section-title">

            <p>MY COLLECTION</p>

            <h2>3D Models</h2>

        </div>


        <div class="model-grid">


            <article class="model-card">

                <div class="viewer">
                    <canvas id="viewer1"></canvas>
                </div>

                <div class="model-info">
                    <h3>Ferrari F40</h3>
                </div>

            </article>


            <article class="model-card">

                <div class="viewer">
                    <canvas id="viewer2"></canvas>
                </div>

                <div class="model-info">
                    <h3>Basketball</h3>
                </div>

            </article>


            <article class="model-card">

                <div class="viewer">
                    <canvas id="viewer3"></canvas>
                </div>

                <div class="model-info">
                    <h3>Chair</h3>
                </div>

            </article>


        </div>

    </section>


    <script type="module" src="script.js"></script>

</body>

</html>
