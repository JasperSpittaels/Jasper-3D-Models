<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jasper's 3D Models</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">Jasper's 3D Models</div>

    <nav>
        <a href="#models">Models</a>
    </nav>
</header>


<main>

    <section class="hero">
        <div>
            <p class="small-title">DIGITAL 3D ASSETS</p>

            <h1>
                Jasper's<br>
                <span>3D Models</span>
            </h1>

            <a href="#models" class="hero-button">
                Explore Models
            </a>
        </div>
    </section>


    <section id="models" class="models-section">

        <div class="section-title">
            <p>MY COLLECTION</p>
            <h2>3D Models</h2>
        </div>


        <div class="model-grid">

            <article class="model-card">

                <div class="viewer">
                    <canvas id="viewer1"></canvas>

                    <div class="loading" id="loading1">
                        Loading...
                    </div>
                </div>

                <div class="model-info">
				
                    <h3>Model One</h3>

                    <div class="model-bottom">
					
                        <button onclick="openProduct(1)">
                            View
                        </button>

                    </div>

                </div>

            </article>
			
			<article class="model-card">

                <div class="viewer">
                    <canvas id="viewer1"></canvas>

                    <div class="loading" id="loading1">
                        Loading...
                    </div>
                </div>

                <div class="model-info">
				
                    <h3>Model One</h3>

                    <div class="model-bottom">
					
                        <button onclick="openProduct(1)">
                            View
                        </button>

                    </div>

                </div>

            </article>
			
			<article class="model-card">

                <div class="viewer">
                    <canvas id="viewer1"></canvas>

                    <div class="loading" id="loading1">
                        Loading...
                    </div>
                </div>

                <div class="model-info">
				
                    <h3>Model One</h3>

                    <div class="model-bottom">
					
                        <button onclick="openProduct(1)">
                            View
                        </button>

                    </div>

                </div>

            </article>

        </div>

    </section>

</main>

<div id="productModal" class="modal">

    <div class="modal-content">

        <button class="close" onclick="closeProduct()">
            ×
        </button>

        <h2 id="modalTitle">Model</h2>

        <p id="modalDescription">
            3D model information.
        </p>

        <div class="modal-price" id="modalPrice">
            €5.00
        </div>

        <button class="buy-button">
            Buy Model
        </button>

    </div>

</div>


<script type="module" src="script.js"></script>

</body>
</html>
